server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cerberus1.lan cerberus1.local;

    # Never send dashboard Basic credentials over cleartext HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name cerberus1.lan cerberus1.local;

    ssl_certificate /etc/nginx/ssl/cerberus1.lan.crt;
    ssl_certificate_key /etc/nginx/ssl/cerberus1.lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DGXDashboard:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
